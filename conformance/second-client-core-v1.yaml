fixture: second-client-core-v1
protocol: workspace.v1
purpose: Prove the neutral contract with a non-Astrid TypeScript actor.
actor:
  language: typescript
  product_name: neutral-gallery
  forbidden_symbols: [Astrid, astrid, REIGH, reigh, pack, thread]
steps:
  - id: health
    request: GET /v1/health
    assert: [status=ok, protocol=workspace.v1]
  - id: scoped-handshake
    request: POST /v1/handshake
    body: {protocol: workspace.v1, client_name: neutral-gallery, client_version: 0.1.0, requested_scopes: [realm:read, project:write]}
    assert: [scoped actor_id, realm_id, schema_digest]
  - id: project-create-read
    request: POST /v1/projects
    headers: [Idempotency-Key]
    then: "GET /v1/projects/{project_id}"
    assert: [version=1, same project_id]
  - id: managed-object-ingest
    request: POST /v1/objects
    headers: [Idempotency-Key, Content-Type]
    then: ["GET /v1/objects/{object_id}", "HEAD /v1/objects/{object_id}", "GET /v1/objects/{object_id} Range:bytes=0-3"]
    assert: [sha256 digest, strong ETag, Accept-Ranges=bytes, inclusive Content-Range, 206]
  - id: minimum-composition
    request: neutral document commands for timeline, shot, and reference
    assert: [opaque ids, optimistic version, no product-shaped fields]
  - id: task-observation
    request: POST /v1/tasks
    then: ["GET /v1/runs/{run_id}", "GET /v1/tasks/{task_id}", "GET /v1/events"]
    assert: [capability digest pinned, durable cursor, monotonic sequence]
  - id: cancellation-retry
    request: "POST /v1/tasks/{task_id}/cancel then POST /v1/tasks/{task_id}/retry"
    headers: [Idempotency-Key]
    assert: [deterministic state transitions, version conflict on stale expected_version]
  - id: fake-worker-settlement
    request: "POST /v1/attempts/{attempt_id}/settle"
    assert: [lease_id and fence required, typed outputs, declared effect only, stale/duplicate settlement deterministic]
  - id: registered-capability
    request: POST /v1/executors
    then: ["GET /v1/capabilities", "admit render capability task"]
    assert: [protocol workspace.v1, resource keys, readiness truthful]
